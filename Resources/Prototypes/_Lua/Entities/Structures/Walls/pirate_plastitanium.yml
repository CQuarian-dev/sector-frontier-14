- type: entity
  parent: PlastitaniumWindow
  id: PlastitaniumWindowRusty
  name: rusty plastitanium window
  description: The frame is rusted through, but the glass still holds. Mostly.
  components:
  - type: Sprite
    sprite: _Lua/Structures/Windows/PiratePlastitaniumWindow.rsi
  - type: Icon
    sprite: _Lua/Structures/Windows/PiratePlastitaniumWindow.rsi
  - type: IconSmooth
    key: walls
    base: pirateplastitaniumwindow
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: RGlassRusty
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1850
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 1750
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassReinforced:
            min: 1
            max: 2
          PartRodMetal:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

